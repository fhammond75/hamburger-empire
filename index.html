<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger Empire</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #110600; color: #e8d0a0;
      font-family: 'Segoe UI', sans-serif;
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh; padding: 16px; gap: 14px;
    }
    .panel {
      background: #1a0900; border: 1px solid #8b4400;
      border-radius: 10px; padding: 12px;
    }
    .panel h2 {
      font-size: 0.68rem; color: #ffcc44;
      text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 9px;
    }

    /* LEFT */
    #left-panel { width: 185px; display: flex; flex-direction: column; gap: 12px; padding-top: 48px; }

    #shift-row { display: flex; justify-content: space-between; font-size: 0.71rem; color: #cc9944; margin-bottom: 5px; }
    #shift-bar-wrap { background: #0e0400; border-radius: 4px; height: 10px; overflow: hidden; }
    #shift-bar { height: 100%; border-radius: 4px; background: #44aa44; transition: width 0.3s; }

    #recipe-list { overflow-y: auto; max-height: 400px; }
    #recipe-list::-webkit-scrollbar { width: 4px; }
    #recipe-list::-webkit-scrollbar-track { background: #0e0400; }
    #recipe-list::-webkit-scrollbar-thumb { background: #6b3400; border-radius: 2px; }
    .fam-label { font-size: 0.63rem; color: #ffcc44; text-transform: uppercase; letter-spacing: 1px; padding: 5px 0 2px; border-bottom: 1px solid #2a1000; margin-bottom: 2px; }
    .r-row { display: flex; align-items: center; gap: 5px; padding: 3px 0; font-size: 0.7rem; color: #cc9944; }
    .r-row.unknown { opacity: 0.22; }
    .r-emoji { font-size: 1rem; width: 22px; text-align: center; }
    .r-val { margin-left: auto; font-size: 0.6rem; color: #664422; }

    /* CENTER */
    #center { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    h1 { font-size: 1.55rem; color: #ffcc44; text-shadow: 0 0 16px #ff8800; letter-spacing: 2px; }

    #grid {
      display: grid;
      grid-template-columns: repeat(5, 86px);
      grid-template-rows: repeat(5, 86px);
      gap: 5px;
      background: #0e0400; border: 2px solid #8b4400;
      border-radius: 10px; padding: 9px;
      box-shadow: 0 0 28px #ff440020;
    }
    .cell {
      background: #160700; border: 1.5px solid #3d1800;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative;
      transition: border-color 0.12s, background 0.12s;
      user-select: none; overflow: hidden;
    }
    .cell:hover { border-color: #ff8800; background: #220e00; }
    .cell.sel { border-color: #ff8800; background: #2a1200; box-shadow: inset 0 0 10px #ff880033; }
    .cell.merge-target { border-color: #44ff88; background: #001a08; animation: gpulse 0.9s infinite; }
    @keyframes gpulse { 0%,100% { box-shadow: inset 0 0 0 #0000; } 50% { box-shadow: inset 0 0 10px #44ff8840; } }

    .item-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; pointer-events: none; }
    .i-em { font-size: 2.1rem; line-height: 1.1; }
    .i-nm { font-size: 0.46rem; color: #cc9944; text-align: center; padding: 0 2px; line-height: 1.2; }
    .merge-hint {
      position: absolute; top: 3px; right: 3px;
      display: flex; align-items: center; gap: 1px;
      pointer-events: none; line-height: 1;
    }
    .merge-hint .mh-arrow { font-size: 0.5rem; color: #ff8800; }
    .merge-hint .mh-next  { font-size: 0.95rem; }
    .merge-hint .mh-max   { font-size: 0.5rem; color: #ffcc44; font-weight: bold; background: #2a1200; border-radius: 4px; padding: 1px 3px; }

    #action-bar { display: flex; gap: 8px; min-height: 34px; }
    .abtn {
      background: #2a1200; border: 1px solid #8b4400; border-radius: 8px;
      color: #ffcc44; padding: 5px 13px; font-size: 0.75rem;
      cursor: pointer; transition: background 0.12s;
    }
    .abtn:hover { background: #3d1a00; }
    .abtn.sell { border-color: #44aa44; color: #44ff88; }

    #generators { display: flex; gap: 10px; }
    .gen {
      background: #1a0900; border: 2px solid #8b4400; border-radius: 10px;
      padding: 9px 16px; display: flex; flex-direction: column; align-items: center;
      gap: 3px; cursor: pointer; min-width: 108px;
      transition: border-color 0.12s, transform 0.1s;
    }
    .gen:hover:not(.cooling) { border-color: #ff8800; transform: translateY(-2px); }
    .gen.cooling { opacity: 0.55; cursor: not-allowed; }
    .g-em { font-size: 2rem; }
    .g-nm { font-size: 0.7rem; color: #ffcc44; }
    .g-cd { font-size: 0.6rem; color: #664422; height: 13px; }
    .g-bar { width: 78px; height: 4px; background: #1a0800; border-radius: 2px; overflow: hidden; }
    .g-fill { height: 100%; background: #ff8800; border-radius: 2px; }

    #hint { font-size: 0.64rem; color: #664422; }

    /* RIGHT */
    #right-panel { width: 210px; display: flex; flex-direction: column; gap: 12px; padding-top: 48px; }

    #coins-val { font-size: 1.55rem; color: #ffcc44; font-weight: bold; }
    #score-line { font-size: 0.7rem; color: #664422; margin-top: 2px; }

    .order-card {
      background: #1e0a00; border: 1.5px solid #6b3400;
      border-radius: 8px; padding: 8px; margin-bottom: 8px;
      cursor: pointer; transition: border-color 0.12s;
    }
    .order-card:last-child { margin-bottom: 0; }
    .order-card:hover:not(.expired) { border-color: #ff8800; }
    .order-card.expired { border-color: #661111; opacity: 0.55; cursor: default; }
    .oc-top { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
    .oc-cust { font-size: 1.35rem; }
    .oc-items { display: flex; gap: 3px; flex-wrap: wrap; }
    .oc-itm { font-size: 1.15rem; background: rgba(255,255,255,0.06); border-radius: 4px; padding: 2px 4px; position: relative; }
    .oc-itm.done { opacity: 0.25; }
    .oc-itm.done::after { content: '✓'; position: absolute; top: -2px; right: -3px; font-size: 0.55rem; color: #44ff88; }
    .oc-stars { margin-left: auto; font-size: 0.62rem; white-space: nowrap; }
    .oc-secs { font-size: 0.59rem; color: #664422; margin-bottom: 3px; }
    .oc-bar { height: 4px; border-radius: 2px; transition: width 0.25s, background 0.5s; }

    .sbtn {
      width: 100%; background: #1a0900; border: 1px solid #6b3400;
      border-radius: 7px; color: #e8d0a0; padding: 7px 9px; font-size: 0.74rem;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      transition: background 0.12s; margin-bottom: 6px;
    }
    .sbtn:last-child { margin-bottom: 0; }
    .sbtn:hover:not(:disabled) { background: #2a1200; }
    .sbtn:disabled { opacity: 0.32; cursor: default; }
    .s-cost { color: #ccaa00; font-size: 0.69rem; }

    #popups {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column-reverse; gap: 5px;
      pointer-events: none; z-index: 999;
    }
    .toast {
      background: #1e0900ee; border: 1px solid #ff8800; border-radius: 20px;
      padding: 5px 14px; font-size: 0.78rem; color: #ffcc44; white-space: nowrap;
      animation: tin 0.2s ease, tout 0.3s ease 1.8s forwards;
    }
    @keyframes tin  { from { opacity: 0; transform: translateY(8px) scale(0.9); } to { opacity: 1; transform: none; } }
    @keyframes tout { to   { opacity: 0; transform: translateY(-6px); } }

    .drag-ghost {
      position: fixed; pointer-events: none; z-index: 1000;
      font-size: 3.4rem; line-height: 1;
      opacity: 0.88;
      transform: scale(1.15) rotate(-6deg);
      filter: drop-shadow(0 6px 18px #000c);
      transition: none;
    }
    .cell.drag-src { opacity: 0.25; }
  </style>
</head>
<body>

<div id="left-panel">
  <div class="panel">
    <h2>📊 Shift Progress</h2>
    <div id="shift-row"><span id="shift-lbl">Shift 1</span><span id="shift-amt">$0 / $50</span></div>
    <div id="shift-bar-wrap"><div id="shift-bar" style="width:0%"></div></div>
  </div>
  <div class="panel">
    <h2>📖 Recipe Book</h2>
    <div id="recipe-list"></div>
  </div>
</div>

<div id="center">
  <h1>🍔 Hamburger Empire</h1>
  <div id="grid"></div>
  <div id="action-bar"></div>
  <div id="generators"></div>
  <div id="hint">Click item → click match to merge &nbsp;·&nbsp; Right-click to sell</div>
</div>

<div id="right-panel">
  <div class="panel">
    <h2>💰 Resources</h2>
    <div id="coins-val">$0</div>
    <div id="score-line">Score: 0</div>
  </div>
  <div class="panel">
    <h2>🛎️ Orders</h2>
    <div id="orders-list"><div style="color:#664422;font-size:0.74rem;text-align:center;padding:8px 0">Customers incoming…</div></div>
  </div>
  <div class="panel">
    <h2>👥 Staff</h2>
    <button class="sbtn" id="btn-cook"    onclick="hireStaff('cook')">
      <span>👨‍🍳 Line Cook <small id="cook-ct">(0)</small></span>
      <span class="s-cost" id="cook-cost-lbl">$100</span>
    </button>
    <button class="sbtn" id="btn-cashier" onclick="hireStaff('cashier')">
      <span>💁 Cashier <small id="cashier-ct">(0)</small></span>
      <span class="s-cost" id="cashier-cost-lbl">$150</span>
    </button>
  </div>
</div>

<div id="popups"></div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────

const FAMILIES = [
  { name: 'Pickle',  emoji: '🥒' },
  { name: 'Tomato',  emoji: '🍅' },
  { name: 'Lettuce', emoji: '🥬' },
  { name: 'Onion',   emoji: '🧅' },
];

// 4 families × 4 tiers; index = family*4 + tier
const ITEMS = [
  { name: 'Cucumber',      emoji: '🥒', family: 0, tier: 0, value: 2  },
  { name: 'Dill Pickle',   emoji: '🥒', family: 0, tier: 1, value: 5  },
  { name: 'Pickle Jar',    emoji: '🫙', family: 0, tier: 2, value: 12 },
  { name: 'Relish',        emoji: '🌿', family: 0, tier: 3, value: 30 },

  { name: 'Tomato',        emoji: '🍅', family: 1, tier: 0, value: 2  },
  { name: 'Diced Tomato',  emoji: '🍅', family: 1, tier: 1, value: 5  },
  { name: 'Tomato Paste',  emoji: '🥫', family: 1, tier: 2, value: 12 },
  { name: 'Marinara',      emoji: '🍝', family: 1, tier: 3, value: 30 },

  { name: 'Lettuce',       emoji: '🥬', family: 2, tier: 0, value: 2  },
  { name: 'Shredded',      emoji: '🥬', family: 2, tier: 1, value: 5  },
  { name: 'Salad Mix',     emoji: '🥗', family: 2, tier: 2, value: 12 },
  { name: 'Garden Salad',  emoji: '🥗', family: 2, tier: 3, value: 30 },

  { name: 'Onion',         emoji: '🧅', family: 3, tier: 0, value: 2  },
  { name: 'Sliced Onion',  emoji: '🧅', family: 3, tier: 1, value: 5  },
  { name: 'Caramel Onion', emoji: '🧅', family: 3, tier: 2, value: 12 },
  { name: 'Onion Rings',   emoji: '🍱', family: 3, tier: 3, value: 30 },
];

const T0 = [0, 4, 8, 12];
const CUSTS = ['👴','👵','👨','👩','🧑','👦','👧','🧔','👱','🧕'];

// ── STATE ─────────────────────────────────────────────────────────────────────

const board = new Array(25).fill(null); // null | { type: int }
let sel = -1;
let coins = 0, score = 0;
let shiftNum = 1, shiftGoal = 50, shiftSales = 0;
let orders = [], oid = 1;
let cooks = 0, cashiers = 0;
const discovered = new Set();

let bsCharges = 30;      // clicks remaining before cooldown
let bsCool    = 0;       // ms remaining in cooldown
const BS_FIRST   = 30;   // charges in first batch
const BS_REFILL  = 15;   // charges on each refill
const BS_COOL_MS = 10000; // cooldown between batches

let cookTimer = 0, cashierTimer = 0;
const COOK_MS = 7000, CASHIER_MS = 4000;

const S3 = 30000, S2 = 20000, S1 = 10000;

let lastTs = performance.now();
let ordersTs = 0;
let orderTmr = null;

// drag state
let dragFrom = -1;
let dragging  = false;
let dragGhost = null;
let dragSuppressClick = false;

// ── GRID ──────────────────────────────────────────────────────────────────────

function buildGrid() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.dataset.idx = i;
    c.addEventListener('click',       () => { if (dragSuppressClick) { dragSuppressClick = false; return; } onCell(i); });
    c.addEventListener('mousedown',   e  => onDragStart(e, i));
    c.addEventListener('contextmenu', e  => { e.preventDefault(); sellCell(i); });
    g.appendChild(c);
  }
}

function renderGrid() {
  const cells = document.querySelectorAll('.cell');
  const selType = sel >= 0 && board[sel] ? board[sel].type : -1;
  cells.forEach((c, i) => {
    c.innerHTML = '';
    c.className = 'cell';
    if (i === sel) c.classList.add('sel');
    else if (selType >= 0 && board[i] && board[i].type === selType) c.classList.add('merge-target');

    const item = board[i];
    if (!item) return;
    const d = ITEMS[item.type];
    const hint = document.createElement('div'); hint.className = 'merge-hint';
    if (d.tier < 3) {
      const next = ITEMS[item.type + 1];
      hint.innerHTML = `<span class="mh-arrow">+1→</span><span class="mh-next">${next.emoji}</span>`;
    } else {
      hint.innerHTML = `<span class="mh-max">MAX</span>`;
    }
    const wrap = document.createElement('div'); wrap.className = 'item-inner';
    wrap.innerHTML = `<span class="i-em">${d.emoji}</span><span class="i-nm">${d.name}</span>`;
    c.appendChild(hint); c.appendChild(wrap);
  });
  renderActionBar();
}

function renderActionBar() {
  const bar = document.getElementById('action-bar');
  bar.innerHTML = '';
  if (sel >= 0 && board[sel]) {
    const d = ITEMS[board[sel].type];
    const btn = document.createElement('button');
    btn.className = 'abtn sell';
    btn.textContent = `Sell ${d.emoji} ${d.name}  +$${d.value}`;
    btn.onclick = () => sellCell(sel);
    bar.appendChild(btn);
  }
}

// ── CELL INTERACTION ──────────────────────────────────────────────────────────

function onCell(i) {
  if (!board[i]) {
    if (sel >= 0 && board[sel]) { board[i] = board[sel]; board[sel] = null; sel = -1; }
    renderGrid(); return;
  }
  if (sel < 0) { sel = i; renderGrid(); return; }
  if (sel === i) { sel = -1; renderGrid(); return; }
  if (board[sel] && board[i] && board[sel].type === board[i].type) {
    doMerge(sel, i);
  } else {
    sel = i; renderGrid();
  }
}

function sellCell(i) {
  if (!board[i]) return;
  const d = ITEMS[board[i].type];
  board[i] = null;
  if (sel === i) sel = -1;
  coins += d.value;
  shiftSales += d.value;
  score += d.value;
  toast(`${d.emoji} Sold ${d.name}  +$${d.value}`);
  renderGrid(); checkShift(); updateUI();
}

// ── DRAG ──────────────────────────────────────────────────────────────────────

let _dragX0, _dragY0;

function onDragStart(e, i) {
  if (!board[i] || e.button !== 0) return;
  e.preventDefault();
  dragFrom = i;
  dragging  = false;
  _dragX0 = e.clientX;
  _dragY0 = e.clientY;
}

function onDragMove(e) {
  if (dragFrom < 0) return;
  const dist = Math.hypot(e.clientX - _dragX0, e.clientY - _dragY0);
  if (!dragging && dist > 5) {
    dragging = true;
    // build ghost
    const d = ITEMS[board[dragFrom].type];
    dragGhost = document.createElement('div');
    dragGhost.className = 'drag-ghost';
    dragGhost.textContent = d.emoji;
    document.body.appendChild(dragGhost);
    // dim source
    document.querySelectorAll('.cell')[dragFrom].classList.add('drag-src');
  }
  if (dragging && dragGhost) {
    dragGhost.style.left = (e.clientX - 28) + 'px';
    dragGhost.style.top  = (e.clientY - 28) + 'px';
  }
}

function onDragEnd(e) {
  if (dragFrom < 0) return;
  if (dragging) {
    dragSuppressClick = true;
    // hide ghost FIRST so it doesn't block elementFromPoint
    if (dragGhost) { dragGhost.style.visibility = 'hidden'; }
    const cells = document.querySelectorAll('.cell');
    cells[dragFrom].classList.remove('drag-src');

    // find target cell under cursor (ghost is hidden so this works correctly)
    const el   = document.elementFromPoint(e.clientX, e.clientY);
    const cell = el?.closest('.cell');
    const to   = cell ? +cell.dataset.idx : -1;
    if (dragGhost) { dragGhost.remove(); dragGhost = null; }

    if (to >= 0 && to !== dragFrom && board[dragFrom]) {
      if (!board[to]) {
        // move to empty
        board[to] = board[dragFrom];
        board[dragFrom] = null;
        sel = -1;
        renderGrid();
      } else if (board[to].type === board[dragFrom].type) {
        // merge on drop
        doMerge(dragFrom, to);
      }
      // else: occupied by different type — put back silently
    }
    dragging = false;
  }
  dragFrom = -1;
}

// ── MERGE ─────────────────────────────────────────────────────────────────────

function doMerge(from, to) {
  const type = board[from].type;
  if (ITEMS[type].tier >= 3) { toast('⚠️ Already max tier!'); sel = -1; renderGrid(); return; }
  const next = type + 1;
  board[to] = { type: next };
  board[from] = null;
  sel = -1;
  discover(next);
  renderGrid(); updateUI();
}

// ── BASKET ────────────────────────────────────────────────────────────────────

function buildGenerator() {
  const wrap = document.getElementById('generators');
  const g = document.createElement('div');
  g.className = 'gen'; g.id = 'gen-basket';
  g.innerHTML = `
    <div class="g-em">🧺</div>
    <div class="g-nm">Veggie Basket</div>
    <div class="g-cd" id="bscd"><span id="bs-charges">30</span> left</div>
    <div class="g-bar"><div class="g-fill" id="bsfill" style="width:0%"></div></div>
  `;
  g.addEventListener('click', useBasket);
  wrap.appendChild(g);
}

function useBasket() {
  if (bsCool > 0) { toast(`⏳ New basket in ${(bsCool/1000).toFixed(1)}s…`); return; }
  if (bsCharges <= 0) return;
  const empties = board.reduce((a, v, i) => { if (!v) a.push(i); return a; }, []);
  if (!empties.length) { toast('😱 Board full! Merge or sell something.'); return; }
  const type = T0[Math.floor(Math.random() * T0.length)];
  const idx  = empties[Math.floor(Math.random() * empties.length)];
  board[idx] = { type };
  discover(type);
  bsCharges--;
  if (bsCharges <= 0) {
    bsCool = BS_COOL_MS;
    toast('🧺 Basket empty! New one incoming…');
  }
  updateBasketUI();
  renderGrid();
}

// ── DISCOVERY ─────────────────────────────────────────────────────────────────

function discover(type) {
  if (discovered.has(type)) return;
  discovered.add(type);
  if (ITEMS[type].tier > 0) toast(`📖 Discovered: ${ITEMS[type].emoji} ${ITEMS[type].name}!`);
  renderRecipes();
}

// ── ORDERS ────────────────────────────────────────────────────────────────────

function schedOrder(delay) {
  clearTimeout(orderTmr);
  orderTmr = setTimeout(spawnOrder, delay);
}

function spawnOrder() {
  if (orders.length >= 3) { schedOrder(4000); return; }
  const maxTier = Math.min(3, shiftNum - 1);
  const pool = [...discovered].filter(t => ITEMS[t].tier <= maxTier);
  if (!pool.length) { schedOrder(5000); return; }

  const now = Date.now();
  const count = shiftNum >= 3 && Math.random() < 0.35 ? 2 : 1;
  const wants = [], used = new Set();
  for (let i = 0; i < count; i++) {
    const avail = pool.filter(t => !used.has(t));
    if (!avail.length) break;
    const t = avail[Math.floor(Math.random() * avail.length)];
    used.add(t); wants.push({ type: t, served: false });
  }
  orders.push({
    id: oid++, wants,
    customer: CUSTS[Math.floor(Math.random() * CUSTS.length)],
    createdAt: now,
    star3End: now + S3, star2End: now + S3 + S2, deadline: now + S3 + S2 + S1,
    expired: false,
  });
  renderOrders();
  schedOrder(8000 + Math.random() * 5000);
}

function starsFor(o) {
  const n = Date.now();
  return n < o.star3End ? 3 : n < o.star2End ? 2 : n < o.deadline ? 1 : 0;
}
function timerPct(o) { return Math.max(0, (o.deadline - Date.now()) / (o.deadline - o.createdAt)); }
function timerClr(s) { return s===3?'#44cc44':s===2?'#ccaa00':s===1?'#cc4400':'#660000'; }

function renderOrders() {
  const list = document.getElementById('orders-list');
  if (!orders.length) {
    list.innerHTML = '<div style="color:#664422;font-size:0.74rem;text-align:center;padding:8px 0">No orders yet…</div>';
    return;
  }
  list.innerHTML = '';
  for (const o of orders) {
    const stars = starsFor(o);
    const pct   = timerPct(o);
    const secs  = Math.max(0, Math.ceil((o.deadline - Date.now()) / 1000));
    const card  = document.createElement('div');
    card.className = 'order-card' + (o.expired ? ' expired' : '');

    const itemsHtml = o.wants.map(w => {
      const d = ITEMS[w.type];
      return `<div class="oc-itm${w.served?' done':''}" title="${d.name}">${d.emoji}</div>`;
    }).join('');

    card.innerHTML = `
      <div class="oc-top">
        <span class="oc-cust">${o.customer}</span>
        <div class="oc-items">${itemsHtml}</div>
        <span class="oc-stars">${'⭐'.repeat(stars)}</span>
      </div>
      <div class="oc-secs">${o.expired ? 'Expired' : secs + 's left'}</div>
      <div class="oc-bar" style="width:${(pct*100).toFixed(1)}%;background:${timerClr(stars)}"></div>
    `;
    if (!o.expired) card.addEventListener('click', () => tryServe(o));
    list.appendChild(card);
  }
}

function tryServe(o) {
  for (const w of o.wants) {
    if (w.served) continue;
    const ci = board.findIndex(b => b && b.type === w.type);
    if (ci >= 0) {
      board[ci] = null;
      if (sel === ci) sel = -1;
      w.served = true;
      renderGrid();
      if (o.wants.every(x => x.served)) { completeOrder(o); return; }
      renderOrders(); return;
    }
  }
  toast('❌ No matching item on board!');
}

function completeOrder(o) {
  const stars = starsFor(o);
  const bonus = [0, 3, 8, 15][stars];
  coins += bonus;
  shiftSales += 10; score += 10 + bonus;
  orders = orders.filter(x => x.id !== o.id);
  toast(`${'⭐'.repeat(stars) || '💨'} Order complete!  +$${bonus} bonus`);
  checkShift(); renderOrders(); updateUI();
  schedOrder(3000);
}

// ── STAFF ─────────────────────────────────────────────────────────────────────

const cookCost    = () => Math.floor(100 * Math.pow(1.5, cooks));
const cashierCost = () => Math.floor(150 * Math.pow(1.5, cashiers));

function hireStaff(type) {
  if (type === 'cook') {
    const c = cookCost(); if (coins < c) { toast('💸 Not enough coins!'); return; }
    coins -= c; cooks++; toast('👨‍🍳 Line Cook hired!');
  } else {
    const c = cashierCost(); if (coins < c) { toast('💸 Not enough coins!'); return; }
    coins -= c; cashiers++; toast('💁 Cashier hired!');
  }
  updateUI();
}

function doCookTick(dt) {
  if (!cooks) return;
  cookTimer += dt * cooks;
  if (cookTimer < COOK_MS) return;
  cookTimer %= COOK_MS;
  const groups = {};
  board.forEach((item, i) => { if (item) { (groups[item.type] = groups[item.type] || []).push(i); } });
  for (const [t, idxs] of Object.entries(groups)) {
    if (idxs.length >= 2 && ITEMS[+t].tier < 3) {
      doMerge(idxs[0], idxs[1]);
      toast('👨‍🍳 Cook merged items!');
      return;
    }
  }
}

function doCashierTick(dt) {
  if (!cashiers) return;
  cashierTimer += dt * cashiers;
  if (cashierTimer < CASHIER_MS) return;
  cashierTimer %= CASHIER_MS;
  for (const o of orders) {
    if (o.expired) continue;
    for (const w of o.wants) {
      if (w.served) continue;
      const ci = board.findIndex(b => b && b.type === w.type);
      if (ci >= 0) {
        board[ci] = null;
        if (sel === ci) sel = -1;
        w.served = true;
        renderGrid();
        if (o.wants.every(x => x.served)) { completeOrder(o); toast('💁 Cashier served!'); return; }
        renderOrders(); return;
      }
    }
  }
}

// ── SHIFT ─────────────────────────────────────────────────────────────────────

function checkShift() {
  if (shiftSales >= shiftGoal) {
    shiftNum++;
    shiftGoal = Math.floor(50 * Math.pow(1.6, shiftNum - 1));
    shiftSales = 0;
    toast(`🎉 Shift ${shiftNum} started!  Goal: $${shiftGoal}`);
    updateUI();
  }
}

// ── RECIPES ───────────────────────────────────────────────────────────────────

function renderRecipes() {
  const list = document.getElementById('recipe-list');
  list.innerHTML = '';
  for (let f = 0; f < 4; f++) {
    const lbl = document.createElement('div');
    lbl.className = 'fam-label';
    lbl.textContent = `${FAMILIES[f].emoji} ${FAMILIES[f].name}`;
    list.appendChild(lbl);
    for (let t = 0; t < 4; t++) {
      const type  = f * 4 + t;
      const d     = ITEMS[type];
      const known = discovered.has(type);
      const row   = document.createElement('div');
      row.className = 'r-row' + (known ? '' : ' unknown');
      row.innerHTML = `
        <span class="r-emoji">${d.emoji}</span>
        <span>${known ? d.name : '???'}</span>
        <span class="r-val">${known ? '$' + d.value : ''}</span>
      `;
      list.appendChild(row);
    }
  }
}

function updateBasketUI() {
  const cooling = bsCool > 0;
  const gen = document.getElementById('gen-basket');
  const cd  = document.getElementById('bscd');
  const bar = document.getElementById('bsfill');
  if (!gen) return;
  gen.classList.toggle('cooling', cooling);
  if (cooling) {
    const pct = (1 - bsCool / BS_COOL_MS) * 100;
    bar.style.width = pct + '%';
    cd.innerHTML = `New basket in ${(bsCool/1000).toFixed(1)}s`;
  } else {
    bar.style.width = '0%';
    cd.innerHTML = `<span id="bs-charges">${bsCharges}</span> left`;
  }
}

// ── TICK ──────────────────────────────────────────────────────────────────────

function tick(ts) {
  const dt = ts - lastTs; lastTs = ts;

  if (bsCool > 0) {
    bsCool = Math.max(0, bsCool - dt);
    if (bsCool === 0) {
      bsCharges = BS_REFILL;
      toast(`🧺 New basket ready!  ${BS_REFILL} items`);
    }
    updateBasketUI();
  }

  const now = Date.now();
  for (const o of orders) { if (!o.expired && now > o.deadline) o.expired = true; }
  orders = orders.filter(o => !o.expired || now - o.deadline < 3000);

  doCookTick(dt);
  doCashierTick(dt);

  if (ts - ordersTs > 250) { renderOrders(); ordersTs = ts; }

  requestAnimationFrame(tick);
}

// ── UI ────────────────────────────────────────────────────────────────────────

function updateUI() {
  document.getElementById('coins-val').textContent = `$${coins}`;
  document.getElementById('score-line').textContent = `Score: ${score}`;
  document.getElementById('shift-lbl').textContent  = `Shift ${shiftNum}`;
  document.getElementById('shift-amt').textContent  = `$${shiftSales} / $${shiftGoal}`;
  document.getElementById('shift-bar').style.width  = Math.min(100, shiftSales / shiftGoal * 100) + '%';
  document.getElementById('cook-ct').textContent    = `(${cooks})`;
  document.getElementById('cashier-ct').textContent = `(${cashiers})`;
  const cc = cookCost(), cac = cashierCost();
  document.getElementById('cook-cost-lbl').textContent    = `$${cc}`;
  document.getElementById('cashier-cost-lbl').textContent = `$${cac}`;
  document.getElementById('btn-cook').disabled    = coins < cc;
  document.getElementById('btn-cashier').disabled = coins < cac;
}

function toast(msg) {
  const wrap = document.getElementById('popups');
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  wrap.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}

// ── INIT ──────────────────────────────────────────────────────────────────────

function init() {
  buildGrid();
  buildGenerator();
  T0.forEach(discover);
  renderRecipes();
  updateUI();
  schedOrder(6000);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup',   onDragEnd);
  requestAnimationFrame(tick);
}

init();
</script>
</body>
</html>
