<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger Empire</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #110600;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 18px;
      gap: 18px;
    }

    #game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    h1 {
      font-size: 1.5rem;
      color: #ffcc44;
      text-shadow: 0 0 14px #ff8800;
      letter-spacing: 2px;
    }

    #canvas {
      border: 2px solid #ff8800;
      border-radius: 8px;
      background: #0c0300;
      display: block;
      box-shadow: 0 0 28px #ff440033;
      cursor: crosshair;
    }

    #hint {
      color: #664422;
      font-size: 0.78rem;
    }

    #sidebar {
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 44px;
    }

    .panel {
      background: #1e0c00;
      border: 1px solid #8b4400;
      border-radius: 8px;
      padding: 12px;
    }

    .panel h2 {
      font-size: 0.78rem;
      color: #ffcc44;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #score-val {
      font-size: 2rem;
      color: #ff8800;
      font-weight: bold;
      line-height: 1;
    }

    #best-val  { font-size: 0.75rem; color: #664422; margin-top: 3px; }
    #coins-val { font-size: 0.82rem; color: #ccaa00; margin-top: 6px; }

    #day-val { font-size: 1rem; color: #ffaa44; }
    #served-val { font-size: 0.75rem; color: #664422; margin-top: 3px; }

    #cap-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cc9944; margin-bottom: 6px; }
    #cap-bar-wrap { background: #1a0800; border-radius: 4px; height: 8px; margin-bottom: 8px; overflow: hidden; }
    #cap-bar { height: 100%; border-radius: 4px; transition: width 0.2s, background 0.3s; }

    .upg-btn {
      width: 100%;
      background: #2a1200;
      border: 1px solid #6b3400;
      border-radius: 6px;
      color: #fff;
      padding: 7px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
      margin-bottom: 6px;
    }
    .upg-btn:last-child { margin-bottom: 0; }
    .upg-btn:hover:not(:disabled) { background: #3d1a00; }
    .upg-btn:disabled { opacity: 0.3; cursor: default; }
    .upg-btn .cost { color: #ccaa00; font-size: 0.72rem; }

    .chain-grid { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .chain-step { font-size: 1.15rem; }
    .chain-arrow { font-size: 0.6rem; color: #553311; }
  </style>
</head>
<body>

<div id="game-wrap">
  <h1>🍔 Hamburger Empire</h1>
  <canvas id="canvas" width="540" height="660"></canvas>
  <div id="hint">Click arena → drop pickle &nbsp;·&nbsp; Click item → select &nbsp;·&nbsp; Selected + 🗑 → trash</div>
</div>

<div id="sidebar">
  <div class="panel">
    <h2>Score</h2>
    <div id="score-val">0</div>
    <div id="best-val">Best: 0</div>
    <div id="coins-val">🪙 0 coins</div>
  </div>

  <div class="panel">
    <h2>Shift</h2>
    <div id="day-val">Day 1</div>
    <div id="served-val">0 orders served</div>
  </div>

  <div class="panel">
    <h2>Kitchen</h2>
    <div id="cap-row">
      <span id="cap-label">0 / 12</span>
      <span id="cap-pct">0%</span>
    </div>
    <div id="cap-bar-wrap"><div id="cap-bar"></div></div>
    <button class="upg-btn" id="btn-expand" onclick="buyExpand()">
      <span>Expand +4 slots</span>
      <span class="cost" id="expand-cost">🪙 30</span>
    </button>
  </div>

  <div class="panel">
    <h2>Power-ups</h2>
    <button class="upg-btn" id="btn-attract" onclick="buyAttract()">
      <span>🧲 Magnet (30s)</span>
      <span class="cost">🪙 25</span>
    </button>
    <button class="upg-btn" id="btn-clear" onclick="buyClear()">
      <span>💨 Clear Junk</span>
      <span class="cost">🪙 50</span>
    </button>
  </div>

  <div class="panel">
    <h2>Merge Chain</h2>
    <div class="chain-grid" id="chain-grid"></div>
  </div>
</div>

<script>
// ─── Setup ────────────────────────────────────────────────────────────────────

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const ORDER_H   = 110;
const ARENA_TOP = ORDER_H;
const TRASH_SIZE = 68;
const TRASH_X   = W - TRASH_SIZE - 8;
const TRASH_Y   = H - TRASH_SIZE - 8;

const ITEMS = [
  { emoji: '🥒', name: 'Pickle',     radius: 20, value: 5   },
  { emoji: '🍅', name: 'Tomato',     radius: 26, value: 12  },
  { emoji: '🥬', name: 'Lettuce',    radius: 32, value: 25  },
  { emoji: '🧅', name: 'Onion',      radius: 38, value: 50  },
  { emoji: '🧀', name: 'Cheese',     radius: 44, value: 90  },
  { emoji: '🥩', name: 'Patty',      radius: 50, value: 160 },
  { emoji: '🍔', name: 'Burger',     radius: 58, value: 280 },
  { emoji: '🍟', name: 'Fries',      radius: 66, value: 480 },
  { emoji: '🥤', name: 'Shake',      radius: 74, value: 800 },
  { emoji: '🎉', name: 'Value Meal', radius: 84, value:1400 },
];

const CUSTOMERS = ['👴','👩','🧑','👶','👱','🧔','👸','🤠','🧕','👲'];

// freshness thresholds in ms
const FRESH_MS  = 25000;
const WARM_MS   = 55000;

// ─── Game state ───────────────────────────────────────────────────────────────

let score        = 0;
let best         = 0;
let coins        = 0;
let ordersServed = 0;
let maxItems     = 12;
let expandLevel  = 0;
const EXPAND_COSTS = [30, 80, 200, 500];

let magnetActive = false;
let magnetEnd    = 0;
let selectedItem = null;

const items     = [];
const orders    = [];
const particles = [];
const popups    = [];

let nextId  = 0;
let orderSeed = 0;

// ─── Merge chain UI ──────────────────────────────────────────────────────────

(function() {
  const g = document.getElementById('chain-grid');
  ITEMS.forEach((it, i) => {
    const s = document.createElement('span');
    s.className = 'chain-step';
    s.title = it.name;
    s.textContent = it.emoji;
    g.appendChild(s);
    if (i < ITEMS.length - 1) {
      const a = document.createElement('span');
      a.className = 'chain-arrow';
      a.textContent = '›';
      g.appendChild(a);
    }
  });
})();

// ─── Orders ───────────────────────────────────────────────────────────────────

function maxOrderSlots() {
  // unlock second slot after 3 serves
  return ordersServed >= 3 ? 2 : 1;
}

function maxOrderTier() {
  // Tier 1 minimum — pickles are the seed ingredient, not orderable
  return Math.min(ITEMS.length - 2, 1 + Math.floor(ordersServed / 4));
}

function spawnOrder() {
  if (orders.length >= maxOrderSlots()) return;
  // tier 1 (tomato) at minimum; grows with experience
  const max  = maxOrderTier();
  const tier = 1 + Math.floor(Math.random() * max);
  orders.push({
    id: orderSeed++,
    type: tier,
    createdAt: Date.now(),
    customer: CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)],
  });
}

function freshness(order) {
  const age = Date.now() - order.createdAt;
  if (age < FRESH_MS)  return { stars: 3, label: 'Fresh!',    mult: 3, color: '#44dd66' };
  if (age < WARM_MS)   return { stars: 2, label: 'Getting cold', mult: 2, color: '#ffaa22' };
  return                      { stars: 1, label: 'Cold…',     mult: 1, color: '#cc4422' };
}

function tryAutoServe(itemType) {
  const idx = orders.findIndex(o => o.type === itemType);
  if (idx === -1) return false;

  const order  = orders[idx];
  const f      = freshness(order);
  const earned = ITEMS[itemType].value * f.mult;
  const coinEarned = Math.max(1, Math.floor(earned / 6));

  orders.splice(idx, 1);

  score  += earned;
  coins  += coinEarned;
  best    = Math.max(best, score);
  ordersServed++;

  addPopup(W / 2, ARENA_TOP + 40, `${f.stars === 3 ? '🌟' : f.stars === 2 ? '⭐' : '☆'} +${earned}`);
  updateUI();

  // spawn replacement after short delay
  setTimeout(spawnOrder, 1200);
  return true;
}

// ─── Items ────────────────────────────────────────────────────────────────────

function createItem(type, x, y, vx, vy) {
  return {
    id: nextId++,
    type,
    x, y,
    vx: vx ?? (Math.random() - 0.5) * 0.8,
    vy: vy ?? (Math.random() - 0.5) * 0.8,
    radius:    ITEMS[type].radius,
    scale:     0.05,
    glowTimer: 0,
  };
}

function removeItem(item) {
  const i = items.indexOf(item);
  if (i !== -1) items.splice(i, 1);
  if (selectedItem === item) selectedItem = null;
}

function getItemAt(x, y) {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if ((it.x - x) ** 2 + (it.y - y) ** 2 <= it.radius ** 2) return it;
  }
  return null;
}

function spawnPickle(x, y) {
  if (items.length >= maxItems) {
    addPopup(x, y, '🍳 Kitchen Full!');
    return;
  }
  const r  = ITEMS[0].radius;
  items.push(createItem(0,
    Math.max(r, Math.min(W - r, x)),
    Math.max(ARENA_TOP + r, Math.min(H - r, y))
  ));
  updateUI();
}

function discardSelected() {
  if (!selectedItem) return;
  spawnParticles(selectedItem.x, selectedItem.y, '💨', 5);
  removeItem(selectedItem);
  updateUI();
}

// ─── Merge ────────────────────────────────────────────────────────────────────

function mergeItems(a, b) {
  const mx = (a.x + b.x) / 2;
  const my = (a.y + b.y) / 2;
  const nextType = a.type + 1;

  spawnParticles(mx, my, ITEMS[a.type].emoji, 7);
  removeItem(a);
  removeItem(b);

  // Max tier — nowhere to merge
  if (nextType >= ITEMS.length) {
    addPopup(mx, my, '🏆 MAX!');
    updateUI();
    return;
  }

  const newItem = createItem(nextType, mx, my, 0, 0);
  newItem.glowTimer = 50;
  items.push(newItem);

  // Check if result auto-serves an order
  const served = tryAutoServe(nextType);
  if (served) {
    spawnParticles(mx, my, ITEMS[nextType].emoji, 10);
    removeItem(newItem);
  }

  updateUI();
}

// ─── Particles / popups ───────────────────────────────────────────────────────

function spawnParticles(x, y, emoji, count = 7) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.4;
    const spd   = 1.8 + Math.random() * 2.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      emoji,
      size: 12 + Math.random() * 8,
    });
  }
}

function addPopup(x, y, text) {
  popups.push({ x, y, text, life: 1, vy: -1.2 });
}

// ─── Upgrades ─────────────────────────────────────────────────────────────────

function buyExpand() {
  if (expandLevel >= EXPAND_COSTS.length || coins < EXPAND_COSTS[expandLevel]) return;
  coins -= EXPAND_COSTS[expandLevel];
  maxItems += 4;
  expandLevel++;
  updateUI();
}

function buyAttract() {
  if (coins < 25) return;
  coins -= 25;
  magnetActive = true;
  magnetEnd    = Date.now() + 30000;
  updateUI();
}

function buyClear() {
  if (coins < 50) return;
  coins -= 50;
  // remove all items that don't match any active order
  const wantedTypes = new Set(orders.map(o => o.type));
  const toRemove = items.filter(it => !wantedTypes.has(it.type));
  toRemove.forEach(it => {
    spawnParticles(it.x, it.y, '💨', 4);
    removeItem(it);
  });
  addPopup(W / 2, H / 2, `Cleared ${toRemove.length} items!`);
  updateUI();
}

// ─── UI ───────────────────────────────────────────────────────────────────────

function updateUI() {
  document.getElementById('score-val').textContent  = score.toLocaleString();
  document.getElementById('best-val').textContent   = `Best: ${best.toLocaleString()}`;
  document.getElementById('coins-val').textContent  = `🪙 ${coins} coins`;
  document.getElementById('day-val').textContent    = `Day ${Math.floor(ordersServed / 5) + 1}`;
  document.getElementById('served-val').textContent = `${ordersServed} orders served`;

  const pct = items.length / maxItems;
  document.getElementById('cap-label').textContent = `${items.length} / ${maxItems}`;
  document.getElementById('cap-pct').textContent   = `${Math.round(pct * 100)}%`;
  document.getElementById('cap-bar').style.width      = `${Math.min(100, pct * 100)}%`;
  document.getElementById('cap-bar').style.background = pct >= 0.9 ? '#ff3300' : pct >= 0.7 ? '#ff8800' : '#44cc66';

  const expandBtn  = document.getElementById('btn-expand');
  const expandCost = document.getElementById('expand-cost');
  if (expandLevel >= EXPAND_COSTS.length) {
    expandBtn.disabled = true;
    expandCost.textContent = 'Max!';
  } else {
    expandBtn.disabled     = coins < EXPAND_COSTS[expandLevel];
    expandCost.textContent = `🪙 ${EXPAND_COSTS[expandLevel]}`;
  }

  document.getElementById('btn-attract').disabled = coins < 25 || magnetActive;
  document.getElementById('btn-clear').disabled   = coins < 50;
}

// ─── Input ────────────────────────────────────────────────────────────────────

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // Trash zone (only when something is selected)
  if (selectedItem && mx >= TRASH_X && my >= TRASH_Y) {
    discardSelected();
    return;
  }

  const hit = getItemAt(mx, my);
  if (hit && hit.scale >= 0.85) {
    selectedItem = (hit === selectedItem) ? null : hit;
    return;
  }

  // Click empty arena
  selectedItem = null;
  if (my > ARENA_TOP) spawnPickle(mx, my);
});

// ─── Update ───────────────────────────────────────────────────────────────────

function update() {
  if (magnetActive && Date.now() > magnetEnd) magnetActive = false;

  // Physics
  for (const it of items) {
    if (it.scale < 1) it.scale = Math.min(1, it.scale + 0.07);
    if (it.glowTimer > 0) it.glowTimer--;

    // Random micro-drift
    if (Math.random() < 0.03) {
      it.vx += (Math.random() - 0.5) * 0.2;
      it.vy += (Math.random() - 0.5) * 0.2;
    }

    // Magnet: attract same-type items toward each other
    if (magnetActive) {
      for (const other of items) {
        if (other === it || other.type !== it.type) continue;
        const dx = other.x - it.x, dy = other.y - it.y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d > 0 && d < 220) {
          const f = 0.012 / d;
          it.vx += dx * f;
          it.vy += dy * f;
        }
      }
    }

    it.vx *= 0.97;
    it.vy *= 0.97;

    const spd = Math.sqrt(it.vx ** 2 + it.vy ** 2);
    if (spd > 1.6) { it.vx = it.vx / spd * 1.6; it.vy = it.vy / spd * 1.6; }

    it.x += it.vx;
    it.y += it.vy;

    if (it.x - it.radius < 0)         { it.x = it.radius;         it.vx =  Math.abs(it.vx); }
    if (it.x + it.radius > W)         { it.x = W - it.radius;     it.vx = -Math.abs(it.vx); }
    if (it.y - it.radius < ARENA_TOP) { it.y = ARENA_TOP + it.radius; it.vy = Math.abs(it.vy); }
    if (it.y + it.radius > H)         { it.y = H - it.radius;     it.vy = -Math.abs(it.vy); }
  }

  // Merge detection
  const merged = new Set();
  for (let i = 0; i < items.length; i++) {
    if (merged.has(items[i].id)) continue;
    for (let j = i + 1; j < items.length; j++) {
      if (merged.has(items[j].id)) continue;
      const a = items[i], b = items[j];
      if (a.type !== b.type) continue;
      if (a.scale < 0.9 || b.scale < 0.9) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      if (dx * dx + dy * dy < (a.radius + b.radius) ** 2) {
        merged.add(a.id); merged.add(b.id);
        mergeItems(a, b);
        break;
      }
    }
  }

  // Separation
  for (let i = 0; i < items.length; i++) {
    for (let j = i + 1; j < items.length; j++) {
      const a = items[i], b = items[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d  = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const min = a.radius + b.radius;
      if (d < min) {
        const push = (min - d) / 2;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) {
          a.vx -= rv * nx * 0.3; a.vy -= rv * ny * 0.3;
          b.vx += rv * nx * 0.3; b.vy += rv * ny * 0.3;
        }
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.91; p.vy *= 0.91;
    p.life -= 0.035;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Popups
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y += p.vy;
    p.life -= 0.018;
    if (p.life <= 0) popups.splice(i, 1);
  }
}

// ─── Draw ─────────────────────────────────────────────────────────────────────

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawOrders() {
  // Strip background
  ctx.fillStyle = '#140700';
  ctx.fillRect(0, 0, W, ORDER_H);
  ctx.strokeStyle = '#2a1200';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, ORDER_H); ctx.lineTo(W, ORDER_H); ctx.stroke();

  const slots = maxOrderSlots();
  const slotW = W / slots;

  for (let i = 0; i < slots; i++) {
    const sx  = i * slotW + 10;
    const sw  = slotW - 20;

    if (i < orders.length) {
      const o = orders[i];
      const f = freshness(o);

      // Card
      ctx.fillStyle   = 'rgba(255,136,0,0.07)';
      ctx.strokeStyle = f.stars === 1 ? '#6b1a00' : '#3a1800';
      ctx.lineWidth   = 1;
      roundRect(sx, 6, sw, ORDER_H - 14, 7);
      ctx.fill(); ctx.stroke();

      // Customer emoji
      ctx.font = '22px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(o.customer, sx + sw * 0.22, 36);

      // "wants"
      ctx.fillStyle = '#5a3311';
      ctx.font = '9px sans-serif';
      ctx.fillText('wants', sx + sw * 0.5, 28);

      // Arrow
      ctx.fillStyle = '#5a3311';
      ctx.font = '14px sans-serif';
      ctx.fillText('›', sx + sw * 0.5, 40);

      // Item emoji
      ctx.font = '26px serif';
      ctx.fillText(ITEMS[o.type].emoji, sx + sw * 0.78, 36);

      // Freshness stars
      const stars = '⭐'.repeat(f.stars) + '☆'.repeat(3 - f.stars);
      ctx.font = '11px sans-serif';
      ctx.fillStyle = f.color;
      ctx.fillText(stars, sx + sw / 2, 64);

      // Label
      ctx.font = '9px sans-serif';
      ctx.fillStyle = f.color;
      ctx.fillText(f.label, sx + sw / 2, 80);

      // Value preview
      ctx.fillStyle = '#665522';
      ctx.font = '9px sans-serif';
      ctx.fillText(`${ITEMS[o.type].value * f.mult} pts`, sx + sw / 2, 96);

    } else {
      // Empty slot
      ctx.fillStyle   = 'rgba(255,255,255,0.02)';
      ctx.strokeStyle = '#1a0900';
      ctx.lineWidth = 1;
      roundRect(sx, 6, sw, ORDER_H - 14, 7);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2a1400';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ordersServed < 3 ? `Unlocks at 3 serves` : 'Incoming…', sx + sw / 2, ORDER_H / 2 - 4);
    }
  }

  // Magnet indicator
  if (magnetActive) {
    const rem = Math.ceil((magnetEnd - Date.now()) / 1000);
    ctx.fillStyle = '#44aaff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText(`🧲 ${rem}s`, W - 8, 4);
  }
}

function drawArena() {
  // Subtle grid
  ctx.strokeStyle = 'rgba(255,80,0,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, ARENA_TOP); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = ARENA_TOP; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // Trash zone
  const trashLit = selectedItem !== null;
  ctx.fillStyle   = trashLit ? 'rgba(255,60,0,0.22)' : 'rgba(60,15,0,0.5)';
  ctx.strokeStyle = trashLit ? '#ff5500' : '#331100';
  ctx.lineWidth   = trashLit ? 2 : 1;
  roundRect(TRASH_X, TRASH_Y, TRASH_SIZE, TRASH_SIZE, 8);
  ctx.fill(); ctx.stroke();

  ctx.font = '26px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🗑️', TRASH_X + TRASH_SIZE / 2, TRASH_Y + TRASH_SIZE / 2);

  if (trashLit) {
    ctx.fillStyle = '#ff7755';
    ctx.font = '8px sans-serif';
    ctx.fillText('TRASH', TRASH_X + TRASH_SIZE / 2, TRASH_Y + TRASH_SIZE - 8);
  }
}

function drawItems() {
  // Particles (behind items)
  for (const p of particles) {
    ctx.globalAlpha = p.life * 0.9;
    ctx.font = `${p.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.emoji, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  // Items
  for (const it of items) {
    const isSel     = it === selectedItem;
    const wantedIdx = orders.findIndex(o => o.type === it.type);
    const isWanted  = wantedIdx !== -1;
    const f         = isWanted ? freshness(orders[wantedIdx]) : null;

    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.scale(it.scale, it.scale);

    // Shadow / glow
    if (isSel)              { ctx.shadowColor = '#ff5500'; ctx.shadowBlur = 22; }
    else if (it.glowTimer > 0) { ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 14 + it.glowTimer * 0.3; }
    else if (isWanted)      { ctx.shadowColor = f.color;   ctx.shadowBlur = 12; }

    // Circle background
    ctx.beginPath();
    ctx.arc(0, 0, it.radius, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(-it.radius * 0.3, -it.radius * 0.3, it.radius * 0.1, 0, 0, it.radius);
    g.addColorStop(0, 'rgba(255,255,255,0.13)');
    g.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = g;
    ctx.fill();

    ctx.strokeStyle = isSel ? '#ff6600' : isWanted ? f.color : 'rgba(255,160,60,0.25)';
    ctx.lineWidth   = isSel || isWanted ? 2.5 : 1.5;
    ctx.stroke();
    ctx.shadowBlur  = 0;

    // Emoji
    ctx.font = `${it.radius * 1.1}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ITEMS[it.type].emoji, 0, 2);

    // Pulsing ring if selected
    if (isSel) {
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 140);
      ctx.strokeStyle = `rgba(255,85,0,${0.3 + 0.3 * pulse})`;
      ctx.lineWidth   = 3;
      ctx.beginPath();
      ctx.arc(0, 0, it.radius + 7, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Small "wanted" indicator
    if (isWanted && !isSel) {
      ctx.fillStyle = f.color;
      ctx.font = `${it.radius * 0.38}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('▲', 0, -it.radius * 0.62);
    }

    ctx.restore();
  }

  // Popups
  for (const p of popups) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = '#ffdd44';
    ctx.font        = 'bold 15px sans-serif';
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#000';
    ctx.shadowBlur  = 4;
    ctx.fillText(p.text, p.x, p.y);
    ctx.shadowBlur  = 0;
  }
  ctx.globalAlpha = 1;
}

// ─── Main loop ────────────────────────────────────────────────────────────────

function loop() {
  update();
  ctx.clearRect(0, 0, W, H);
  drawOrders();
  drawArena();
  drawItems();
  requestAnimationFrame(loop);
}

// ─── Boot ─────────────────────────────────────────────────────────────────────

updateUI();
spawnOrder();
loop();
</script>
</body>
</html>
